}

  useEffect(() => {
    (async () => {
      try {
        const result = await window.storage.get("voice-reacts", true);
        if (result) setVoiceReacts(JSON.parse(result.value));
      } catch (e) {
        // no saved reacts yet
      }
      try {
        const mine = await window.storage.get("voice-reacted", false);
        if (mine) setVoiceReacted(JSON.parse(mine.value));
      } catch (e) {
        // user hasn't reacted to anything yet
      }
    })();
  }, []);

  const addVoiceReact = (i) => {
    if (voiceReacted[i]) return;

    setVoiceReacted((prev) => {
      const updated = { ...prev, [i]: true };
      (async () => {
        try {
          await window.storage.set("voice-reacted", JSON.stringify(updated), false);
        } catch (e) {
          console.error("Failed to save personal react", e);
        }
      })();
      return updated;
    });

    setVoiceReacts((prev) => {
      const updated = { ...prev, [i]: (prev[i] || 0) + 1 };
      (async () => {
        try {
          await window.storage.set("voice-reacts", JSON.stringify(updated), true);
